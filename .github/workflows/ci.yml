name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    env:
      DEVASSIST_OFFLINE: "1"
      PYTHONHASHSEED: "0"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Type check
        run: mypy src/devassist

      - name: Run tests with branch coverage
        run: >-
          pytest
          --cov=devassist
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=80

      - name: Run offline smoke evaluation
        run: python scripts/evaluate.py --fail-on-threshold --output reports/evaluation.json

      - name: Build wheel and source distribution
        run: python -m build

      - name: Upload coverage and evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports-python-${{ matrix.python-version }}
          if-no-files-found: warn
          path: |
            coverage.xml
            reports/evaluation.json

  container-smoke:
    name: Docker Compose smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and start the non-root service
        run: docker compose up --build --detach

      - name: Verify health and writable feedback volume
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8000/health
          curl --fail --silent \
            --header 'Content-Type: application/json' \
            --data '{"request_id":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","rating":1}' \
            http://127.0.0.1:8000/v1/feedback

      - name: Stop containers
        if: always()
        run: docker compose down --volumes
